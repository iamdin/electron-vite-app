name: PR Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-14
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: |
          npm run build
          npx electron-builder --config electron-builder.dev.yml --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-mac-${{ matrix.arch }}-app
          path: dist/dev/mac-${{ matrix.arch }}/electron-vite-app.app
          retention-days: 7

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-mac-${{ matrix.arch }}-dmg
          path: dist/dev/*-${{ matrix.arch }}.dmg
          retention-days: 7

  comment:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post PR comment with artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const runId = Number(process.env.GITHUB_RUN_ID);

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const byName = new Map(data.artifacts.map((artifact) => [artifact.name, artifact]));
            const rows = [
              ["macOS arm64", "app", "electron-app-mac-arm64-app"],
              ["macOS arm64", "dmg", "electron-app-mac-arm64-dmg"],
              ["macOS x64", "app", "electron-app-mac-x64-app"],
              ["macOS x64", "dmg", "electron-app-mac-x64-dmg"],
            ].map(([platform, kind, name]) => {
              const artifact = byName.get(name);
              const url = artifact
                ? `${runUrl}/artifacts/${artifact.id}`
                : `${runUrl}#artifacts`;
              return `| ${platform} | ${kind} | [${name}](${url}) |`;
            });

            const body = `## 🎉 Build Artifacts Ready\n\n| Platform | Type | Download |\n|----------|------|----------|\n${rows.join("\n")}\n\n> Artifacts expire in 7 days`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
