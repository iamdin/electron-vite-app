name: PR Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-14
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build:dev -- --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-mac-${{ matrix.arch }}-app
          path: dist/dev/mac-${{ matrix.arch }}/electron-vite-app-dev.app
          retention-days: 7

  comment:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post PR comment with artifact links
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const runId = Number(process.env.GITHUB_RUN_ID);

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const byName = new Map(data.artifacts.map((artifact) => [artifact.name, artifact]));
            const rows = [
              ["macOS arm64", "app", "electron-app-mac-arm64-app"],
              ["macOS x64", "app", "electron-app-mac-x64-app"],
            ].map(([platform, kind, name]) => {
              const artifact = byName.get(name);
              const url = artifact
                ? `${runUrl}/artifacts/${artifact.id}`
                : `${runUrl}#artifacts`;
              return `| ${platform} | ${kind} | [${name}](${url}) |`;
            });

            const marker = "## 🎉 Build Artifacts Ready";
            const body = `${marker}\n\n| Platform | Type | Download |\n|----------|------|----------|\n${rows.join("\n")}\n\n> Artifacts expire in 7 days`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
